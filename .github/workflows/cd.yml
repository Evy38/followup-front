name: CD Frontend - Railway

# Déploiement automatique sur Railway après validation du CI.
# Se déclenche uniquement si le CI frontend passe avec succès sur main.
# Peut aussi être déclenché manuellement depuis l'onglet Actions sur GitHub.
#
# Prérequis — secrets GitHub à configurer (Settings → Secrets → Actions) :
#   RAILWAY_DEPLOY_HOOK_FRONTEND : URL du deploy hook du service "frontend" sur Railway
#
# Comment obtenir un deploy hook Railway :
#   Dashboard Railway → ton projet → service frontend → Settings → Deploy Hooks → Generate

on:
  # Déclenchement automatique quand le CI passe sur main
  workflow_run:
    workflows: ["CI - Continuous Integration"]
    types: [completed]
    branches: [main]

  # Déclenchement manuel depuis GitHub Actions
  workflow_dispatch:

jobs:
  deploy:
    name: Déployer sur Railway
    runs-on: ubuntu-latest

    # En automatique : ne déploie que si le CI a réussi
    # En manuel : toujours déployer
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      HOOK_FRONTEND: ${{ secrets.RAILWAY_DEPLOY_HOOK_FRONTEND }}

    steps:
      - name: Vérifier la présence du secret
        run: |
          if [ -z "$HOOK_FRONTEND" ]; then
            echo "RAILWAY_DEPLOY_HOOK_FRONTEND manquant."
            echo "Va dans Railway → service frontend → Settings → Deploy Hooks"
            echo "Copie l'URL et ajoute-la dans GitHub → Settings → Secrets → Actions"
            exit 1
          fi

      - name: Déployer le frontend
        run: |
          echo "Déclenchement du déploiement frontend..."
          curl --fail --silent --show-error -X POST "$HOOK_FRONTEND"
          echo "Frontend : déploiement déclenché."

      - name: Résumé
        run: |
          echo "Le service frontend a été envoyé en déploiement sur Railway."
          echo "Surveille l'avancement ici : https://railway.app/dashboard"
          echo "Les logs sont accessibles dans le service frontend → onglet Deployments."
